[project]
name = "dev-standards"
version = "0.1.0"
description = "Estándares de ingeniería, scaffolding y auditoría automatizada para el ecosistema de proyectos de luciomerlo"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PT", "T20"]

[tool.ruff.lint.per-file-ignores]
# scripts/ son CLIs: imprimir en stdout es su interfaz, no código de depuración.
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
